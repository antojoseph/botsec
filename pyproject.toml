[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botsec"
version = "0.1.0"
description = "AI-powered smart contract vulnerability detection using Claude and Halmos formal verification"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.52.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "toml>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
botsec = "botsec.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/botsec"]

[tool.hatch.build.targets.sdist]
include = ["src/botsec"]

[tool.ruff]
target-version = "py311"
line-length = 100
